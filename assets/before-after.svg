<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc">
  <title id="title">A quiet front, depth on demand</title>
  <desc id="desc">Original synthetic comparison. The before screen presents process logs and premature completion. The after screen states that a video was exported but not published, keeps the saved draft visible, and separates upload retry from technical details.</desc>
  <rect width="1120" height="570" fill="#f4f5f3"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="44" y="54" font-size="27" font-weight="700" fill="#172822">A quiet front. Useful depth.</text>
    <text x="44" y="85" font-size="15" fill="#485b54">Outcome-first product design for AI assistants</text>
    <rect x="44" y="118" width="490" height="372" rx="16" fill="#fff" stroke="#d6ddd8"/>
    <rect x="564" y="118" width="512" height="372" rx="16" fill="#fff" stroke="#d6ddd8"/>
    <text x="70" y="158" font-size="13" font-weight="700" fill="#59665f">BEFORE</text>
    <text x="590" y="158" font-size="13" font-weight="700" fill="#196a4c">AFTER</text>
    <text x="70" y="193" font-size="21" font-weight="700" fill="#34423b">Workflow complete!</text>
    <rect x="70" y="215" width="438" height="64" rx="6" fill="#f2f4f3"/>
    <text x="84" y="239" font-size="13" fill="#54635b">Agent pipeline · Generation · Connector · Tokens</text>
    <text x="84" y="261" font-size="13" fill="#54635b">Executing tools and analyzing workflow status…</text>
    <rect x="70" y="293" width="209" height="67" rx="6" fill="#f2f4f3"/>
    <rect x="291" y="293" width="217" height="67" rx="6" fill="#f2f4f3"/>
    <text x="84" y="319" font-size="13" fill="#54635b">Advanced parameters</text>
    <text x="305" y="319" font-size="13" fill="#54635b">Execution trace</text>
    <text x="84" y="343" font-size="13" fill="#54635b">Model and configuration</text>
    <text x="305" y="343" font-size="13" fill="#54635b">23 background events</text>
    <text x="70" y="390" font-size="13" fill="#865b45">Publishing connector error. See logs.</text>
    <rect x="70" y="414" width="108" height="43" rx="7" fill="#e5e9e6"/>
    <text x="91" y="440" font-size="14" fill="#44534b">Execute</text>
    <text x="590" y="199" font-size="25" font-weight="700" fill="#172822">Your video is exported.</text>
    <text x="590" y="230" font-size="19" fill="#172822">The post is not published yet.</text>
    <text x="590" y="270" font-size="16" fill="#485b54">Your draft is saved.</text>
    <text x="590" y="295" font-size="16" fill="#485b54">Retry the upload when you're ready.</text>
    <rect x="590" y="325" width="143" height="45" rx="8" fill="#196a4c"/>
    <text x="612" y="354" font-size="15" font-weight="700" fill="#fff">Retry upload</text>
    <line x1="590" y1="397" x2="1050" y2="397" stroke="#dde3df"/>
    <text x="590" y="428" font-size="15" fill="#354d40">View upload details</text>
    <text x="590" y="454" font-size="12" fill="#607168">Saved file · Platform error · Last attempt</text>
    <text x="44" y="529" font-size="13" fill="#59665f">Original synthetic diagram. A design example, not a working publishing product or an Instinct screenshot.</text>
  </g>
</svg>
